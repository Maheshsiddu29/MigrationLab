services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: migrationlab
      POSTGRES_USER: migrationlab
      POSTGRES_PASSWORD: migrationlab
    ports:
      - "5432:5432"
    volumes:
      - migrationlab-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrationlab -d migrationlab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  migrationlab-postgres-data:
